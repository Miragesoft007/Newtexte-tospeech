services:
  - type: web
    name: newtexte-tospeech-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: HF_API_URL
        value: https://openbmb-voxcpm-demo.hf.space/api/predict
